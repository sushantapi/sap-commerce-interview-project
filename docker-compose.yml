services:
  solr:
    image: solr:10.0.0
    container_name: electronics-solr
    command:
      - solr-precreate
      - products
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped

  solr-schema-init:
    image: solr:10.0.0
    depends_on:
      - solr
    volumes:
      - ./docker/solr-schema-init.sh:/opt/solr-schema-init.sh:ro
    entrypoint:
      - /bin/bash
      - -c
      - tr -d '\r' < /opt/solr-schema-init.sh | /bin/bash
    restart: "no"

volumes:
  solr_data:
